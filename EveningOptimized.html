<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c0c14">
  <title>Klocka</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0c14;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding:
        max(env(safe-area-inset-top),  1.5rem)
        env(safe-area-inset-right)
        max(env(safe-area-inset-bottom), 1.5rem)
        env(safe-area-inset-left);
      gap: clamp(1.5rem, 5vh, 3rem);
    }

    canvas { display: block; }

    #digital {
      font-size: clamp(3rem, 16vw, 6rem);
      font-weight: 200;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.92);
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1;
    }
  </style>
</head>
<body>
  <canvas id="clock"></canvas>
  <div id="digital">--:--</div>

  <script>
    // ─── Tidskonstanter (identiska med alt3) ──────────────────────────────────
    const A           = 0.3;
    const EVE_START   = 16 * 3600 + 30 * 60;
    const EVE_SPAN    = 7.5 * 3600;
    const EVE_PEAK    = 3.5 * 3600;
    const EVE_AFTER   = EVE_SPAN - EVE_PEAK;
    const DEBT        = A * 2 * EVE_SPAN / Math.PI;
    const DISP_AT_MN  = 86400 - DEBT;
    const SLEEP_SPAN  = 7.5 * 3600;
    const SLEEP_PEAK  = SLEEP_SPAN / 2;

    function getDisplayedSeconds() {
      const now  = new Date();
      const real = now.getHours() * 3600 + now.getMinutes() * 60
                 + now.getSeconds() + now.getMilliseconds() / 1000;

      if (real < SLEEP_SPAN) {
        const t = real;
        let intg;
        if (t <= SLEEP_PEAK) {
          intg = (2 * SLEEP_PEAK / Math.PI) * (1 - Math.cos(Math.PI * t / (2 * SLEEP_PEAK)));
        } else {
          const after = SLEEP_SPAN - SLEEP_PEAK;
          intg = 2 * SLEEP_PEAK / Math.PI
               + 2 * after / Math.PI * Math.cos(Math.PI * (SLEEP_SPAN - t) / (2 * after));
        }
        return DISP_AT_MN + t + A * intg;
      }

      if (real <= EVE_START) return real;

      const t = real - EVE_START;
      let intg;
      if (t <= EVE_PEAK) {
        intg = (2 * EVE_PEAK / Math.PI) * (1 - Math.cos(Math.PI * t / (2 * EVE_PEAK)));
      } else {
        intg = 2 * EVE_PEAK / Math.PI
             + 2 * EVE_AFTER / Math.PI * Math.cos(Math.PI * (EVE_SPAN - t) / (2 * EVE_AFTER));
      }
      return EVE_START + t - A * intg;
    }

    // ─── Canvas & storlek ─────────────────────────────────────────────────────
    const canvas = document.getElementById('clock');
    const ctx    = canvas.getContext('2d');
    let cx, cy, R, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      const size = Math.floor(Math.min(window.innerWidth * 0.82, window.innerHeight * 0.52));
      canvas.style.width  = size + 'px';
      canvas.style.height = size + 'px';
      canvas.width  = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = size / 2;
      cy = size / 2;
      R  = size / 2 - 2;
    }

    window.addEventListener('resize', resize);
    resize();

    // ─── Rithjälp ─────────────────────────────────────────────────────────────
    function a12(fraction) {
      return fraction * 2 * Math.PI - Math.PI / 2;
    }

    function hand(angle, len, width, color, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
      ctx.strokeStyle = color;
      ctx.lineWidth   = width;
      ctx.lineCap     = 'round';
      ctx.stroke();
      ctx.restore();
    }

    // ─── Huvudritning ─────────────────────────────────────────────────────────
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Urtavla
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      const face = ctx.createRadialGradient(cx, cy - R * 0.2, R * 0.1, cx, cy, R);
      face.addColorStop(0, '#1e1e2e');
      face.addColorStop(1, '#13131f');
      ctx.fillStyle = face;
      ctx.fill();

      // Ytterring
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth   = 1.5;
      ctx.stroke();

      // Timmarsstreckar
      for (let i = 0; i < 12; i++) {
        const a      = (i / 12) * 2 * Math.PI - Math.PI / 2;
        const isMain = i % 3 === 0;
        const outer  = R - 2;
        const inner  = isMain ? R - R * 0.13 : R - R * 0.08;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
        ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
        ctx.strokeStyle = isMain ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.3)';
        ctx.lineWidth   = isMain ? R * 0.022 : R * 0.014;
        ctx.lineCap     = 'round';
        ctx.stroke();
      }

      const disp = getDisplayedSeconds();
      const h    = disp / 3600;
      const m    = (h % 1) * 60;
      const s    = (m % 1) * 60;

      // Timvisare
      hand(a12((h % 12) / 12), R * 0.50, R * 0.040, 'rgba(255,255,255,0.95)');
      // Minutvisare
      hand(a12(m / 60),        R * 0.72, R * 0.026, 'rgba(255,255,255,0.90)');
      // Sekundvisare
      hand(a12(s / 60),        R * 0.82, R * 0.014, '#e8805a');
      // Sekundvisare motvikt
      hand(a12(s / 60) + Math.PI, R * 0.18, R * 0.014, '#e8805a');

      // Centrumcirkel
      ctx.beginPath();
      ctx.arc(cx, cy, R * 0.045, 0, Math.PI * 2);
      ctx.fillStyle = '#e8805a';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, R * 0.018, 0, Math.PI * 2);
      ctx.fillStyle = '#0c0c14';
      ctx.fill();

      // Digital
      const totalMin = Math.floor(disp / 60);
      const hh = String(Math.floor(totalMin / 60) % 24).padStart(2, '0');
      const mm = String(totalMin % 60).padStart(2, '0');
      document.getElementById('digital').textContent = `${hh}:${mm}`;
    }

    function loop() { draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
